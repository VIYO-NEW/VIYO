##
# VIYO Deploy Pipeline
#
# Deploys the worker to Render and verifies all services are live.
# This workflow is MANUAL-ONLY (workflow_dispatch) until Render + DNS
# are configured. Once infrastructure is ready:
#   1. Set RENDER_DEPLOY_HOOK_URL secret in GitHub repo settings
#   2. Configure DNS: api.viyo.new, app.viyo.new, admin.viyo.new
#   3. Uncomment the `push` trigger below to enable auto-deploy on merge
##
name: VIYO Deploy Pipeline

on:
  # Pre-alpha auto-deploy enabled by PO decision; revert to workflow_dispatch-only at Alpha entry.
    push:
        branches: [main]
          workflow_dispatch:

          concurrency:
            group: deploy-production
              cancel-in-progress: false # Never cancel in-flight deploys

              env:
                NODE_VERSION: "22"
                  PNPM_VERSION: "9.15.4"
                    WORKER_HEALTH_URL: "https://api.viyo.new/health"
                      WEB_URL: "https://app.viyo.new"
                        ADMIN_URL: "https://admin.viyo.new"

                        jobs:
                          # Step 1: Run full CI before deploying
                            ci:
                                name: CI Gate
                                    uses: ./.github/workflows/ci.yml

                                      # Step 2: Deploy worker to Render (fails fast if secret is missing)
                                        deploy-worker:
                                            name: Deploy Worker → Render
                                                needs: ci
                                                    runs-on: ubuntu-latest
                                                        timeout-minutes: 10
                                                            outputs:
                                                                  deployed: ${{ steps.trigger.outputs.deployed }}

                                                                      steps:
                                                                            - name: Verify Render is configured
                                                                                    run: |
                                                                                              if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
                                                                                                
