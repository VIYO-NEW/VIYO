# This blueprint reflects live Render service settings as ratified per
# docs/governance/INFRASTRUCTURE_DECISIONS.md (PO Decision 1, 2026-05-08).
# Production tracks main; staging tracks staging.
# Branch values must remain aligned with live Render dashboard settings.

# ============================================================
# Render Blueprint — VIYO Worker Services
# Authority: R21 §5, Doc4 §2.2, Doc1 lines 9690-9700, T90 / SEC-10 Builder Execution Brief
# Docs: https://docs.render.com/blueprint-spec
# ============================================================

services:
  - type: web
    name: viyo-worker
    runtime: docker
    dockerfilePath: apps/worker/Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - fromGroup: viyo-worker-production
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: OTEL_SERVICE_NAME
        value: viyo-worker

  - type: web
    name: viyo-worker-staging
    runtime: docker
    dockerfilePath: apps/worker/Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    branch: staging
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - fromGroup: viyo-worker-staging
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: R2_BUCKET_NAME
        value: viyo-assets-staging
      - key: OTEL_SERVICE_NAME
        value: viyo-worker-staging
